<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>제목 태그 h1 ~ h6</title>
</head>
<body>
    <h1>h1 - 문서의 대표 제목 (한 페이지에 한 번)</h1>
    <h2>h2 - 큰 단락 제목</h2>
    <h3>h3 - h2 안의 소제목</h3>
    <h4>h4 - h3 안의 소제목</h4>
    <h5>h5 - h4 안의 소제목</h5>
    <h6>h6 - 가장 낮은 단계의 제목</h6>

    <p>p - 일반 문단</p>
</body>
</html>
